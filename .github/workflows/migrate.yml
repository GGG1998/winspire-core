name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to migrate'
        required: true
        type: choice
        options:
          - all
          - tournament
          - matchmaking
          - game-management
      action:
        description: 'Migration action'
        required: true
        type: choice
        options:
          - apply
          - status
          - down
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      down_count:
        description: 'Number of migrations to rollback (only for down action)'
        required: false
        default: '1'
      dry_run:
        description: 'Dry run (show SQL without executing)'
        required: false
        type: boolean
        default: false

env:
  ATLAS_VERSION: v0.28.0

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Atlas
        uses: ariga/setup-atlas@v0
        with:
          version: ${{ env.ATLAS_VERSION }}

      - name: Set database URL
        id: db
        run: |
          # Use environment-specific secret
          case "${{ inputs.environment }}" in
            dev)
              DB_URL="${{ secrets.DATABASE_URL_DEV }}"
              ;;
            staging)
              DB_URL="${{ secrets.DATABASE_URL_STAGING }}"
              ;;
            prod)
              DB_URL="${{ secrets.DATABASE_URL_PROD }}"
              ;;
          esac

          # Check if URL was set
          if [ -z "$DB_URL" ]; then
            echo "::error::DATABASE_URL_${{ inputs.environment }} secret not configured"
            exit 1
          fi

          echo "url=$DB_URL" >> $GITHUB_OUTPUT

      - name: Check migration status
        if: inputs.action == 'status' || inputs.action == 'apply'
        run: |
          if [ "${{ inputs.service }}" == "all" ]; then
            SERVICES="tournament matchmaking game-management"
          else
            SERVICES="${{ inputs.service }}"
          fi

          for SERVICE in $SERVICES; do
            echo "### Migration Status for $SERVICE" >> $GITHUB_STEP_SUMMARY

            # Use service-specific revisions schema to isolate migration tracking
            REVISIONS_SCHEMA="${SERVICE//-/_}_revisions"

            atlas migrate status \
              --dir file://services/$SERVICE/migrations \
              --url "${{ steps.db.outputs.url }}" \
              --revisions-schema "$REVISIONS_SCHEMA" | tee status.txt

            echo '```' >> $GITHUB_STEP_SUMMARY
            cat status.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      - name: Apply migrations
        if: inputs.action == 'apply'
        id: apply
        run: |
          if [ "${{ inputs.service }}" == "all" ]; then
            SERVICES="tournament matchmaking game-management"
          else
            SERVICES="${{ inputs.service }}"
          fi

          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "DRY RUN MODE - No changes will be made"
          fi

          for SERVICE in $SERVICES; do
            echo "Applying migrations for $SERVICE..."

            # Use service-specific revisions schema to isolate migration tracking
            REVISIONS_SCHEMA="${SERVICE//-/_}_revisions"

            # Attempt migration
            if atlas migrate apply \
              --dir file://services/$SERVICE/migrations \
              --url "${{ steps.db.outputs.url }}" \
              --revisions-schema "$REVISIONS_SCHEMA" \
              $DRY_RUN_FLAG 2>&1 | tee apply.txt; then
              echo "### Migration Applied Successfully for $SERVICE" >> $GITHUB_STEP_SUMMARY
            else
              echo "status=failed" >> $GITHUB_OUTPUT
              echo "### Migration Failed for $SERVICE" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat apply.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            echo '```' >> $GITHUB_STEP_SUMMARY
            cat apply.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

          echo "status=success" >> $GITHUB_OUTPUT

      - name: Rollback migrations
        if: inputs.action == 'down'
        run: |
          if [ "${{ inputs.service }}" == "all" ]; then
            SERVICES="tournament matchmaking game-management"
          else
            SERVICES="${{ inputs.service }}"
          fi

          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "DRY RUN MODE - No changes will be made"
          fi

          for SERVICE in $SERVICES; do
            echo "Rolling back ${{ inputs.down_count }} migration(s) for $SERVICE..."

            # Use service-specific revisions schema to isolate migration tracking
            REVISIONS_SCHEMA="${SERVICE//-/_}_revisions"

            atlas migrate down \
              --dir file://services/$SERVICE/migrations \
              --url "${{ steps.db.outputs.url }}" \
              --dev-url "sqlite://dev?mode=memory" \
              --revisions-schema "$REVISIONS_SCHEMA" \
              $DRY_RUN_FLAG \
              ${{ inputs.down_count }} 2>&1 | tee down.txt

            echo "### Rollback Complete for $SERVICE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat down.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

  # Auto-rollback job if apply fails
  auto-rollback:
    needs: migrate
    if: failure() && inputs.action == 'apply' && inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Atlas
        uses: ariga/setup-atlas@v0
        with:
          version: ${{ env.ATLAS_VERSION }}

      - name: Set database URL
        id: db
        run: |
          case "${{ inputs.environment }}" in
            dev)
              echo "url=${{ secrets.DATABASE_URL_DEV }}" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "url=${{ secrets.DATABASE_URL_STAGING }}" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "url=${{ secrets.DATABASE_URL_PROD }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Auto-rollback failed migration
        run: |
          echo "### Auto-Rollback Triggered" >> $GITHUB_STEP_SUMMARY
          echo "Migration failed, attempting to rollback last migration..." >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.service }}" == "all" ]; then
            SERVICES="tournament matchmaking game-management"
          else
            SERVICES="${{ inputs.service }}"
          fi

          for SERVICE in $SERVICES; do
            echo "Rolling back $SERVICE..."

            # Use service-specific revisions schema to isolate migration tracking
            REVISIONS_SCHEMA="${SERVICE//-/_}_revisions"

            atlas migrate down \
              --dir file://services/$SERVICE/migrations \
              --url "${{ steps.db.outputs.url }}" \
              --dev-url "sqlite://dev?mode=memory" \
              --revisions-schema "$REVISIONS_SCHEMA" \
              1 2>&1 | tee rollback.txt

            echo "#### Rollback for $SERVICE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat rollback.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

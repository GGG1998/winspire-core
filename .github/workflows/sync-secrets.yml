name: Sync Secrets to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: eu-central-1

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync secrets to AWS Secrets Manager
        run: |
          ENV="${{ inputs.environment }}"

          echo "Syncing secrets for environment: $ENV"

          # Function to update or create secret
          update_secret() {
            local name=$1
            local value=$2
            local full_name="${ENV}/winspire/${name}"

            if [ -z "$value" ]; then
              echo "Skipping $name (empty value)"
              return
            fi

            echo "Updating secret: $full_name"

            # Try to update, create if doesn't exist
            aws secretsmanager put-secret-value \
              --secret-id "$full_name" \
              --secret-string "$value" 2>/dev/null || \
            aws secretsmanager create-secret \
              --name "$full_name" \
              --secret-string "$value"
          }

          # Sync all secrets
          update_secret "postgres-dsn" "${{ secrets.POSTGRES_DSN }}"
          update_secret "jwt-secret" "${{ secrets.JWT_SECRET }}"
          update_secret "supabase-anon-key" "${{ secrets.SUPABASE_ANON_KEY }}"
          update_secret "supabase-service-key" "${{ secrets.SUPABASE_SERVICE_KEY }}"
          update_secret "redis-password" "${{ secrets.REDIS_PASSWORD }}"
          update_secret "game-api-key" "${{ secrets.GAME_API_KEY }}"

          echo "### Secrets Synced" >> $GITHUB_STEP_SUMMARY
          echo "Environment: $ENV" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Updated secrets:" >> $GITHUB_STEP_SUMMARY
          echo "- postgres-dsn" >> $GITHUB_STEP_SUMMARY
          echo "- jwt-secret" >> $GITHUB_STEP_SUMMARY
          echo "- supabase-anon-key" >> $GITHUB_STEP_SUMMARY
          echo "- supabase-service-key" >> $GITHUB_STEP_SUMMARY
          echo "- redis-password" >> $GITHUB_STEP_SUMMARY
          echo "- game-api-key" >> $GITHUB_STEP_SUMMARY

  sync-env-config:
    runs-on: ubuntu-latest
    needs: sync-secrets
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync non-secret config to SSM Parameter Store
        run: |
          ENV="${{ inputs.environment }}"

          echo "Syncing config parameters for environment: $ENV"

          # Function to update or create parameter
          update_param() {
            local name=$1
            local value=$2
            local full_name="/${ENV}/winspire/${name}"

            if [ -z "$value" ]; then
              echo "Skipping $name (empty value)"
              return
            fi

            echo "Updating parameter: $full_name"

            aws ssm put-parameter \
              --name "$full_name" \
              --value "$value" \
              --type String \
              --overwrite 2>/dev/null || \
            aws ssm put-parameter \
              --name "$full_name" \
              --value "$value" \
              --type String
          }

          # Non-secret configuration (from GitHub vars or hardcoded)
          update_param "jwt-issuer" "${{ vars.JWT_ISSUER }}"
          update_param "jwt-audience" "${{ vars.JWT_AUDIENCE }}"
          update_param "supabase-url" "${{ vars.SUPABASE_URL }}"
          update_param "game-api-url" "${{ vars.GAME_API_URL }}"

          echo "### Config Synced" >> $GITHUB_STEP_SUMMARY
          echo "Environment: $ENV" >> $GITHUB_STEP_SUMMARY

Round:
  type: object
  description: A round within a bracket
  properties:
    id:
      type: string
      format: uuid
    bracketId:
      type: string
      format: uuid
    roundNumber:
      type: integer
      format: int32
    name:
      type: string
      description: Display name (e.g., "Quarter Finals", "Semi Finals")
    status:
      $ref: "#/RoundStatus"
    matches:
      type: array
      items:
        $ref: "./Match.yaml#/Match"
    startedAt:
      type: string
      format: date-time
      nullable: true
    completedAt:
      type: string
      format: date-time
      nullable: true

RoundStatus:
  type: string
  enum:
    - pending
    - in_progress
    - completed

version: '3.8'

services:
  game-management:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/src
    ports:
      - "8087:8087"
    environment:
      - APP_ENV=development
      - SERVICE_PORT=8087
      - POSTGRES_DSN=postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
      - REDIS_ADDR=localhost:6379
      - GAME_MANAGEMENT_INTERNAL_API_KEY=IlikeCookies
      - LOG_LEVEL=debug
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: game-management-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:


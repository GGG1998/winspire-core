version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations"
    queries:
      - "internal/repository/queries.sql"
    gen:
      go:
        package: "sqlstore"
        out: "internal/repository/sqlstore"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true



version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/sqlstore/queries.sql"
    schema: "migrations/"
    gen:
      go:
        package: "sqlstore"
        out: "internal/repository/sqlstore"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_prepared_queries: false


version: "3.9"

services:
  auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    image: winspire-auth:dev
    container_name: winspire-auth-dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3


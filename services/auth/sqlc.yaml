version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/queries"
    schema: "migrations"
    gen:
      go:
        package: "models"
        out: "internal/models"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false


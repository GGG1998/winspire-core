version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/store/schema.sql"
    queries:
      - "internal/store/bracket_queries.sql"
      - "internal/store/round_queries.sql"
      - "internal/store/match_queries.sql"
      - "internal/store/prelobby_queries.sql"
      - "internal/store/game_queries.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_exported_queries: true
        overrides:
          - db_type: "pg_catalog.uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"
          # Custom types with driver.Valuer/sql.Scanner for QueryExecModeSimpleProtocol JSONB compatibility
          # See: https://github.com/jackc/pgx/issues/2231
          - column: "tournament_brackets.game_snapshot"
            go_type: "github.com/winspire-core/services/matchmaking/internal/domain.GameSnapshot"
          - column: "prelobby_participant_snapshots.participants"
            go_type: "github.com/winspire-core/services/matchmaking/internal/domain.ParticipantsJSON"

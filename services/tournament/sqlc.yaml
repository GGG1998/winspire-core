version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/sqlc/queries.sql"
    schema: "migrations/"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - column: "tournaments.game_snapshot"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "tournaments.ready_window"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "tournaments.prize"
            go_type:
              import: "encoding/json"
              type: "RawMessage"



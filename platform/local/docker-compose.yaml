# Local Development Environment with LocalStack (emulates AWS ALB)
# Usage: cd platform/local && docker-compose up
#
# Routing Configuration:
#   http://localhost/v1/games*, /v1/g/*, /v1/admin* -> matchmaking:8081 (merged from game-management)
#   http://localhost/v1/matchmaking*                -> matchmaking:8081
#   http://localhost/v1/* (default)                 -> tournament:8089
#
# Direct service access (for E2E tests):
#   http://localhost:8089 -> tournament
#   http://localhost:8088 -> matchmaking (includes game management APIs)

services:
  # LocalStack - AWS Local Emulation (replaces Traefik)
  localstack:
    image: localstack/localstack:3.0
    container_name: winspire-localstack
    ports:
      - "4566:4566"           # LocalStack Gateway (ALB routing)
      - "80:4566"             # HTTP proxy to ALB
      - "4510-4559:4510-4559" # External service ports
    environment:
      - SERVICES=elbv2,ec2,sts,s3
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LOCALSTACK_HOST=localhost
      - EAGER_SERVICE_LOADING=1
      - LS_LOG=warn
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-init:/etc/localstack/init/ready.d"
      - "localstack-data:/var/lib/localstack"
    networks:
      winspire-network:
        aliases:
          - localstack.localhost
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis - for JWT caching and SSE Pub/Sub
  redis:
    image: redis:8.4-alpine
    container_name: winspire-redis
    command: redis-server --appendonly no --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - winspire-network

  # Tournament Service (Tournament & Match Management)
  tournament:
    build:
      context: ../..
      dockerfile: services/tournament/cmd/tournament/Dockerfile.dev
    container_name: tournament
    env_file:
      - .env
    ports:
      - "8089:8089"  # Direct access for E2E tests
    environment:
      - APP_ENV=development
      - SERVICE_PORT=8089
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://postgres:postgres@host.docker.internal:54322/postgres?sslmode=disable}
      - MATCHMAKING_BASE_URL=http://matchmaking:8081
      - REDIS_ADDR=redis:6379
      - HOST_JWT_SECRET=${HOST_JWT_SECRET:-your-jwt-secret-here}
      - HOST_JWT_ISSUER=${HOST_JWT_ISSUER:-https://your-project.supabase.co/auth/v1}
      - HOST_JWT_AUDIENCE=${HOST_JWT_AUDIENCE:-authenticated}
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8089/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - winspire-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Matchmaking Service (includes merged game-management functionality)
  matchmaking:
    build:
      context: ../..
      dockerfile: services/matchmaking/cmd/matchmaking/Dockerfile.dev
    container_name: matchmaking
    env_file:
      - .env
    ports:
      - "8088:8081"  # Direct access for E2E tests (8088 externally -> 8081 internally)
    environment:
      - APP_ENV=development
      - SERVICE_PORT=8081
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres?sslmode=disable}
      - REDIS_URL=redis://redis:6379
      - HOST_JWT_SECRET=${HOST_JWT_SECRET:-your-jwt-secret-here}
      - HOST_JWT_ISSUER=${HOST_JWT_ISSUER:-https://your-project.supabase.co/auth/v1}
      - HOST_JWT_AUDIENCE=${HOST_JWT_AUDIENCE:-authenticated}
      - TOURNAMENT_SERVICE_URL=http://tournament:8089
      - GAME_MANAGEMENT_URL=http://localhost:8088
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # Game Management (merged from game-management service)
      - GAME_MANAGEMENT_INTERNAL_API_KEY=IlikeCookies
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-games}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_ENDPOINT=http://localstack:4566
    depends_on:
      redis:
        condition: service_healthy
      tournament:
        condition: service_started
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - winspire-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ALB Target Registrar - registers service IPs with LocalStack ALB
  alb-registrar:
    image: amazon/aws-cli:2.15.0
    container_name: alb-registrar
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for services to be healthy..."
        sleep 15

        # Wait for ALB to be created
        echo "Waiting for ALB setup..."
        until aws --endpoint-url=http://localstack:4566 elbv2 describe-load-balancers --names winspire-local-alb 2>/dev/null; do
            echo "ALB not ready yet, waiting..."
            sleep 5
        done

        echo "ALB is ready. Registering targets..."

        # Get container IPs using DNS resolution
        TOURNAMENT_IP=$$(getent hosts tournament | awk '{ print $$1 }')
        MATCHMAKING_IP=$$(getent hosts matchmaking | awk '{ print $$1 }')

        echo "Container IPs:"
        echo "  Tournament: $$TOURNAMENT_IP"
        echo "  Matchmaking: $$MATCHMAKING_IP (includes game management)"

        # Get target group ARNs
        TG_TOURNAMENT=$$(aws --endpoint-url=http://localstack:4566 elbv2 describe-target-groups --names tournament-tg --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || echo "")
        TG_MATCHMAKING=$$(aws --endpoint-url=http://localstack:4566 elbv2 describe-target-groups --names matchmaking-tg --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || echo "")

        if [ -z "$$TG_TOURNAMENT" ] || [ -z "$$TG_MATCHMAKING" ]; then
            echo "ERROR: Could not find all target groups"
            exit 1
        fi

        # Register targets
        echo "Registering tournament ($$TOURNAMENT_IP:8089)..."
        aws --endpoint-url=http://localstack:4566 elbv2 register-targets \
            --target-group-arn "$$TG_TOURNAMENT" \
            --targets Id="$$TOURNAMENT_IP",Port=8089

        echo "Registering matchmaking ($$MATCHMAKING_IP:8081)..."
        aws --endpoint-url=http://localstack:4566 elbv2 register-targets \
            --target-group-arn "$$TG_MATCHMAKING" \
            --targets Id="$$MATCHMAKING_IP",Port=8081

        echo ""
        echo "============================================"
        echo "Target Registration Complete!"
        echo "============================================"
        echo ""
        echo "Test routing:"
        echo "  curl http://localhost/v1/cups           # -> tournament"
        echo "  curl http://localhost/v1/games          # -> matchmaking (game management merged)"
        echo "  curl http://localhost/v1/matchmaking/health  # -> matchmaking"
        echo ""

        # Keep container running for debugging
        echo "Registration complete. Container will stay alive for debugging."
        tail -f /dev/null
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      localstack:
        condition: service_healthy
      tournament:
        condition: service_healthy
      matchmaking:
        condition: service_healthy
    networks:
      - winspire-network

networks:
  winspire-network:
    driver: bridge

volumes:
  localstack-data:

# Local Development Environment with Traefik (simulates AWS ALB)
# Usage: cd platform/local && docker-compose up

services:
  # Traefik - API Gateway (simulates AWS ALB)
  traefik:
    image: traefik:v3.0
    container_name: winspire-gateway
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
      # Enable sticky sessions (like ALB)
      - "--providers.docker.defaultRule=Host(`localhost`)"
    ports:
      - "80:80"       # HTTP
      - "8080:8080"   # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - winspire-network

  # Redis - for JWT caching and SSE Pub/Sub
  redis:
    image: redis:8.4-alpine
    container_name: winspire-redis
    command: redis-server --appendonly no --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - winspire-network

  # Competition Service (Tournament & Match Management)
  competition:
    build:
      context: ../..
      dockerfile: services/competition/cmd/competition/Dockerfile.dev
    container_name: competition
    env_file:
      - .env
    ports:
      - "8089:8089"  # Direct access for E2E tests
    environment:
      # App configuration
      - APP_ENV=development
      - SERVICE_PORT=8089

      # Database (Supabase local)
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql://postgres:postgres@host.docker.internal:54322/postgres?sslmode=disable}
      - MATCHMAKING_BASE_URL=http://matchmaking:8081
      # Redis
      - REDIS_ADDR=redis:6379

      # JWT Auth (Supabase config)
      - HOST_JWT_SECRET=${HOST_JWT_SECRET:-your-jwt-secret-here}
      - HOST_JWT_ISSUER=${HOST_JWT_ISSUER:-https://your-project.supabase.co/auth/v1}
      - HOST_JWT_AUDIENCE=${HOST_JWT_AUDIENCE:-authenticated}
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Path-based routing for tournament/match routes
      - "traefik.http.routers.competition.rule=PathPrefix(`/v1/`)"
      - "traefik.http.routers.competition.entrypoints=web"
      - "traefik.http.routers.competition.priority=1"
      - "traefik.http.services.competition.loadbalancer.server.port=8089"
      # Health check
      - "traefik.http.services.competition.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.competition.loadbalancer.healthcheck.interval=30s"
    networks:
      - winspire-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Game Management Service
  game-management:
    build:
      context: ../..
      dockerfile: services/game-management/cmd/game-management/Dockerfile.dev
    container_name: game-management
    env_file:
      - .env
    environment:
      - GAME_MANAGEMENT_INTERNAL_API_KEY=IlikeCookies
      - SERVICE_PORT=8085
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Path-based routing (like ALB)
      - "traefik.http.routers.game-management.rule=PathPrefix(`/v1/games`) || PathPrefix(`/v1/g`) || PathPrefix(`/v1/admin`)"
      - "traefik.http.routers.game-management.entrypoints=web"
      - "traefik.http.routers.game-management.priority=100"
      - "traefik.http.routers.game-management.middlewares=game-bundle-iframe"
      - "traefik.http.services.game-management.loadbalancer.server.port=8085"
      # Health check
      - "traefik.http.services.game-management.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.game-management.loadbalancer.healthcheck.interval=30s"
      # Middleware to allow iframe embedding for game bundles
      - "traefik.http.middlewares.game-bundle-iframe.headers.customresponseheaders.X-Frame-Options="
      - "traefik.http.middlewares.game-bundle-iframe.headers.customresponseheaders.Content-Security-Policy=frame-ancestors *"
      # CORS middleware for development
      - "traefik.http.middlewares.matchmaking-cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.matchmaking-cors.headers.accesscontrolallowheaders=Origin,Content-Type,Authorization,X-Request-ID"
      - "traefik.http.middlewares.matchmaking-cors.headers.accesscontrolalloworiginlistregex=.*"
      - "traefik.http.middlewares.matchmaking-cors.headers.accesscontrolmaxage=86400"
      - "traefik.http.middlewares.matchmaking-cors.headers.addvaryheader=true"
      - "traefik.http.middlewares.matchmaking-cors.headers.accesscontrolallowcredentials=true"
    networks:
      - winspire-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Matchmaking Service
  matchmaking:
    build:
      context: ../..
      dockerfile: services/matchmaking/cmd/matchmaking/Dockerfile.dev
    container_name: matchmaking
    env_file:
      - .env
    ports:
      - "8088:8081"  # Direct access for E2E tests (8088 externally -> 8081 internally)
    environment:
      - APP_ENV=development
      - SERVICE_PORT=8081

      # Database
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres?sslmode=disable}
      
      # Redis
      - REDIS_URL=redis://redis:6379
      
      # JWT Auth
      - HOST_JWT_SECRET=${HOST_JWT_SECRET:-your-jwt-secret-here}
      - HOST_JWT_ISSUER=${HOST_JWT_ISSUER:-https://your-project.supabase.co/auth/v1}
      - HOST_JWT_AUDIENCE=${HOST_JWT_AUDIENCE:-authenticated}
      
      # Competition Service (for tournament info)
      - COMPETITION_SERVICE_URL=http://competition:8089
      
      # Game Management Service (for game info and URLs)
      - GAME_MANAGEMENT_URL=http://game-management:8085
      
      # Supabase Storage
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    depends_on:
      redis:
        condition: service_healthy
      competition:
        condition: service_started
    labels:
      - "traefik.enable=true"
      # Path-based routing (like ALB)
      - "traefik.http.routers.matchmaking.rule=PathPrefix(`/v1/matchmaking`)"
      - "traefik.http.routers.matchmaking.entrypoints=web"
      - "traefik.http.routers.matchmaking.middlewares=matchmaking-cors"
      - "traefik.http.routers.matchmaking.priority=100"
      - "traefik.http.services.matchmaking.loadbalancer.server.port=8081"
      # CORS middleware for development
      - "traefik.http.middlewares.matchmaking-cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.matchmaking-cors.headers.accesscontrolallowheaders=Origin,Content-Type,Authorization,X-Request-ID"
      - "traefik.http.middlewares.matchmaking-cors.headers.accesscontrolalloworiginlistregex=.*"
      - "traefik.http.middlewares.matchmaking-cors.headers.accesscontrolmaxage=86400"
      - "traefik.http.middlewares.matchmaking-cors.headers.addvaryheader=true"
      - "traefik.http.middlewares.matchmaking-cors.headers.accesscontrolallowcredentials=true"
      # Health check
      - "traefik.http.services.matchmaking.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.matchmaking.loadbalancer.healthcheck.interval=30s"
    networks:
      - winspire-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  winspire-network:
    driver: bridge

openapi: 3.0.3
info:
  title: Matchmaking Service API - Frontend Contract
  description: |
    API contract for frontend integration with the matchmaking service.
    Documents REST endpoints consumed by the lobby frontend.
  version: 1.1.0
  contact:
    name: Winspire Team

servers:
  - url: /api/matchmaking
    description: Matchmaking service via API gateway

tags:
  - name: Pre-Lobby
    description: Tournament pre-lobby operations (waiting room before bracket generation)
  - name: Brackets
    description: Tournament bracket operations
  - name: Matches
    description: Match operations and lobby actions

paths:
  /v1/tournaments/{tournamentId}/lobby:
    get:
      tags:
        - Pre-Lobby
      summary: Get tournament pre-lobby state
      description: |
        Retrieves the current state of the tournament pre-lobby including participant list,
        grace period status, and countdown information.
        Used for initial page load and polling fallback.
      operationId: getTournamentPreLobby
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Tournament UUID
      responses:
        '200':
          description: Pre-lobby state retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreLobbyStateResponse'
        '404':
          description: Tournament not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User not registered for this tournament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

paths:
  /v1/tournaments/{tournamentId}/bracket:
    get:
      tags:
        - Brackets
      summary: Get bracket by tournament ID
      description: Retrieves the complete bracket structure with all rounds and matches for a tournament
      operationId: getBracketByTournament
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Tournament UUID
      responses:
        '200':
          description: Bracket retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BracketResponse'
        '404':
          description: Bracket not found for tournament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/brackets/{bracketId}:
    get:
      tags:
        - Brackets
      summary: Get bracket by ID
      description: Retrieves bracket by its direct ID
      operationId: getBracket
      parameters:
        - name: bracketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bracket retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BracketResponse'
        '404':
          description: Bracket not found

  /v1/matches/{matchId}:
    get:
      tags:
        - Matches
      summary: Get match details
      description: Retrieves detailed information about a specific match
      operationId: getMatch
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Match retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '404':
          description: Match not found

  /v1/matches/{matchId}/ready:
    post:
      tags:
        - Matches
      summary: Mark player as ready
      description: |
        Marks the authenticated player as ready for the match.
        Requires JWT authentication and player must be a participant.
      operationId: markReady
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ready status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '403':
          description: User is not a participant in this match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Match not found

  /v1/matches/{matchId}/claim-walkover:
    post:
      tags:
        - Matches
      summary: Claim walkover for no-show
      description: |
        Allows a present player to claim a walkover win when opponent
        has not shown up within the timeout window (2 minutes).
      operationId: claimWalkover
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Walkover granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkoverResponse'
        '400':
          description: Cannot claim walkover (opponent present or no opponent assigned)
        '403':
          description: User is not a participant in this match

  /v1/matches/{matchId}/lobby:
    get:
      tags:
        - Matches
      summary: WebSocket lobby connection
      description: |
        Upgrades HTTP connection to WebSocket for real-time lobby updates.
        Requires JWT authentication and player must be a participant.
        
        ## WebSocket Protocol
        
        After connection, server sends `lobby_state` message with current state.
        
        ### Client → Server Messages
        - `ping`: Heartbeat (recommended every 30s)
        - `ready`: Mark player as ready
        - `unready`: Cancel ready status (if allowed by match state)
        
        ### Server → Client Messages
        - `pong`: Heartbeat response
        - `lobby_state`: Initial state on connect
        - `player_joined`: Opponent joined lobby
        - `player_left`: Opponent left lobby
        - `ready_updated`: Ready state changed
        - `match_starting`: Countdown starting (both ready)
        - `match_started`: Match active, includes game URL
        - `player_disconnected`: Opponent disconnected
        - `player_reconnected`: Opponent reconnected
        - `match_completed`: Match result available
        - `error`: Error message
      operationId: lobbyWebSocket
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '101':
          description: WebSocket upgrade successful
        '403':
          description: User is not a participant in this match

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PreLobbyStateResponse:
      type: object
      required:
        - tournament_id
        - tournament_name
        - start_time
        - status
        - participants
        - participant_count
        - minimum_participants
      properties:
        tournament_id:
          type: string
          format: uuid
        tournament_name:
          type: string
        start_time:
          type: string
          format: date-time
        status:
          type: string
          enum: [waiting, grace_period, generating_bracket, started]
          description: Current tournament pre-lobby status
        participants:
          type: array
          items:
            $ref: '#/components/schemas/PreLobbyParticipant'
        participant_count:
          type: integer
          description: Current number of participants
        minimum_participants:
          type: integer
          description: Minimum required participants
        grace_period_ends_at:
          type: string
          format: date-time
          nullable: true
          description: When grace period ends (null if not active)
        activity_feed:
          type: array
          items:
            $ref: '#/components/schemas/ActivityFeedItem'

    PreLobbyParticipant:
      type: object
      required:
        - id
        - display_name
        - joined_at
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
        joined_at:
          type: string
          format: date-time

    ActivityFeedItem:
      type: object
      required:
        - id
        - type
        - message
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [participant_joined, participant_left, tournament_starting, grace_period_started]
        message:
          type: string
          description: Localized message for display
        timestamp:
          type: string
          format: date-time
        participant_name:
          type: string
          description: Name of participant involved (if applicable)

    BracketResponse:
      type: object
      required:
        - id
        - tournament_id
        - total_rounds
        - total_matches
        - byes_count
        - generated_at
        - rounds
      properties:
        id:
          type: string
          format: uuid
        tournament_id:
          type: string
          format: uuid
        total_rounds:
          type: integer
          minimum: 1
        total_matches:
          type: integer
          minimum: 1
        byes_count:
          type: integer
          minimum: 0
        generated_at:
          type: string
          format: date-time
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/Round'

    Round:
      type: object
      required:
        - id
        - round_number
        - round_name
        - matches_count
        - status
        - matches
      properties:
        id:
          type: string
          format: uuid
        round_number:
          type: integer
          minimum: 1
        round_name:
          type: string
          description: Human-readable name like "Semifinals", "Final"
        matches_count:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, in_progress, completed]
        matches:
          type: array
          items:
            $ref: '#/components/schemas/MatchInBracket'

    MatchInBracket:
      type: object
      required:
        - id
        - match_number
        - participant1_id
        - status
        - participant1_ready
        - participant2_ready
      properties:
        id:
          type: string
          format: uuid
        match_number:
          type: integer
          minimum: 1
        participant1_id:
          type: string
          format: uuid
        participant2_id:
          type: string
          format: uuid
          nullable: true
        next_match_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, ready, started, paused, completed, disputed, cancelled]
        participant1_ready:
          type: boolean
        participant2_ready:
          type: boolean
        winner_id:
          type: string
          format: uuid
          nullable: true
        score_player1:
          type: integer
          nullable: true
        score_player2:
          type: integer
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    MatchResponse:
      type: object
      required:
        - id
        - round_id
        - match_number
        - participant1_id
        - status
        - participant1_ready
        - participant2_ready
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        round_id:
          type: string
          format: uuid
        match_number:
          type: integer
        next_match_id:
          type: string
          format: uuid
          nullable: true
        participant1_id:
          type: string
          format: uuid
        participant2_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, ready, started, paused, completed, disputed, cancelled]
        participant1_ready:
          type: boolean
        participant2_ready:
          type: boolean
        winner_id:
          type: string
          format: uuid
          nullable: true
        score_player1:
          type: integer
          nullable: true
        score_player2:
          type: integer
          nullable: true
        result_source:
          type: string
          enum: [game_api, manual_host, walkover]
          nullable: true
        disconnected_player_id:
          type: string
          format: uuid
          nullable: true
        disconnected_at:
          type: string
          format: date-time
          nullable: true
        game_api_match_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time

    ReadyResponse:
      type: object
      required:
        - message
        - match_id
        - player_id
        - ready
      properties:
        message:
          type: string
        match_id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        ready:
          type: boolean

    WalkoverResponse:
      type: object
      required:
        - message
        - match_id
        - winner_id
        - no_show_player
      properties:
        message:
          type: string
        match_id:
          type: string
          format: uuid
        winner_id:
          type: string
          format: uuid
        no_show_player:
          type: string
          format: uuid

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        details:
          type: string


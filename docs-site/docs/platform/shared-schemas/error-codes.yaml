openapi: 3.0.0
info:
  title: Standard Error Codes
  version: 1.0.0
  description: Standard error codes used across all domains

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          description: Unique request identifier for tracing
          example: "req_123456789"

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable error message
          example: "Invalid input provided"
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    ErrorCode:
      type: string
      enum:
        # Client errors (4xx)
        - VALIDATION_ERROR
        - AUTHENTICATION_REQUIRED
        - PERMISSION_DENIED
        - RESOURCE_NOT_FOUND
        - CONFLICT
        - RATE_LIMIT_EXCEEDED
        
        # Server errors (5xx)
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - TIMEOUT
        - DATABASE_ERROR
        
        # Business logic errors
        - BUSINESS_RULE_VIOLATION
        - INSUFFICIENT_FUNDS
        - INVALID_STATE_TRANSITION
      description: Standard error code

